apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app-deployment
  namespace: webapp
  labels:
    app: web-app
    environment: production
    tier: backendapi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
        environment: production
        tier: backendapi
    spec:
      containers:
      - name: fastapiapp
        image: ajet13/mycicdrepo:94db6a8
        #resources:
         # requests:
          #  memory: "20Mi"
           # cpu: "20m"
          # limits:
           # memory: "64Mi"
           # cpu: "100m"
        ports:
        - containerPort: 80
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 15  # Gives FastAPI 15 seconds to start before checking
          periodSeconds: 20        # Checks every 20 seconds
          timeoutSeconds: 5        # Must respond within 5 seconds
          failureThreshold: 3      # Restarts pod after 3 consecutive failures
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 5   # Starts checking 5 seconds after launch
          periodSeconds: 10        # Checks every 10 seconds
          timeoutSeconds: 2        # Must respond within 2 seconds
          successThreshold: 1      # Needs 1 success to be marked ready
          failureThreshold: 3      # Pulls pod out of service after 3 failures
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web-app-pdb
  namespace: webapp
  labels:
    environment: production
    tier: backendapi
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: web-app
