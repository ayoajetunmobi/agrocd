apiVersion: v1
kind: Service
metadata:
  name: my-service-fastapiapp
  namespace: webapp
  annotations:
     metallb.io/allow-shared-ip: "my-shared-ip-key"
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.254.214
  selector:
    app: web-app
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 80
