apiVersion: v1
kind: Service
metadata:
  name: my-service-fastapiapp
  namespace: webapp
  annotations:
     metallb.io/allow-shared-ip: "my-shared-ip-key" # set this on nodes that will share same ip address, but with a different port
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.254.214  # single ip from your pool
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 80
